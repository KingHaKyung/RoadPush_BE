pple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#14202E" text-anchor="start">대기열</text><text x="493" y="458" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">분석 작업을 쌓고</text><text x="493" y="490" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">워커가 하나씩 처리</text><text x="493" y="534" font-family="'JetBrains Mono','D2Coding','Consolas',monospace" font-size="22" font-weight="600" fill="#14202E" text-anchor="start">pending</text></g><path d="M428.0,425.0 L459.4,425.0" fill="none" stroke="#5B6775" stroke-width="3" stroke-linejoin="round"/><polygon points="469.0,425.0 457.0,431.6 457.0,418.4" fill="#5B6775"/><g id="3 AI 분석"><rect x="810" y="290" width="300" height="270" rx="16" fill="#FBE8DA" stroke="#B4500F" stroke-width="3"/><circle cx="862" cy="342" r="28" fill="#E53935"/><text x="862" y="351.36" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="834" y="418" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#14202E" text-anchor="start">AI 분석</text><text x="834" y="458" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">남은 통로 폭과 막은</text><text x="834" y="490" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">원인을 계산해 판정</text><text x="834" y="534" font-family="'JetBrains Mono','D2Coding','Consolas',monospace" font-size="22" font-weight="600" fill="#B4500F" text-anchor="start">RoadPush_AI</text></g><path d="M769.0,425.0 L800.4,425.0" fill="none" stroke="#5B6775" stroke-width="3" stroke-linejoin="round"/><polygon points="810.0,425.0 798.0,431.6 798.0,418.4" fill="#5B6775"/><g id="4 저장"><rect x="1151" y="290" width="300" height="270" rx="16" fill="#FCFCFA" stroke="#CBD2DA" stroke-width="2"/><circle cx="1203" cy="342" r="28" fill="#E53935"/><text x="1203" y="351.36" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="1175" y="418" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#14202E" text-anchor="start">저장</text><text x="1175" y="458" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">판정 · 근거 이미지 ·</text><text x="1175" y="490" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">모델 버전을 기록</text><text x="1175" y="534" font-family="'JetBrains Mono','D2Coding','Consolas',monospace" font-size="22" font-weight="600" fill="#14202E" text-anchor="start">Supabase</text></g><path d="M1110.0,425.0 L1141.4,425.0" fill="none" stroke="#5B6775" stroke-width="3" stroke-linejoin="round"/><polygon points="1151.0,425.0 1139.0,431.6 1139.0,418.4" fill="#5B6775"/><g id="5 확인 · 조치"><rect x="1492" y="290" width="300" height="270" rx="16" fill="#E3EAFB" stroke="#2457D6" stroke-width="2"/><circle cx="1544" cy="342" r="28" fill="#E53935"/><text x="1544" y="351.36" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="1516" y="418" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#14202E" text-anchor="start">확인 · 조치</text><text x="1516" y="458" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">지도 · 목록에서 검수하고</text><text x="1516" y="490" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">처리 상태 · 메모 기록</text><text x="1516" y="534" font-family="'JetBrains Mono','D2Coding','Consolas',monospace" font-size="22" font-weight="600" fill="#2457D6" text-anchor="start">/dashboard</text></g><path d="M1451.0,425.0 L1482.4,425.0" fill="none" stroke="#5B6775" stroke-width="3" stroke-linejoin="round"/><polygon points="1492.0,425.0 1480.0,431.6 1480.0,418.4" fill="#5B6775"/><g id="판단 유보"><rect x="128" y="610" width="820" height="180" rx="16" fill="#14202E" stroke="#14202E" stroke-width="0"/><text x="156" y="660" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#F5F6F2" text-anchor="start">측정할 수 없으면 판단 유보</text><text x="156" y="704" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#C9D3DF" text-anchor="start">③에서 경계나 통로를 확정하지 못하면 사유와 함께</text><text x="156" y="736" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#C9D3DF" text-anchor="start">유보로 저장하고, ⑤에서 사람이 판정합니다.</text></g><g id="다시 등록"><rect x="972" y="610" width="820" height="180" rx="16" fill="#FCFCFA" stroke="#CBD2DA" stroke-width="2"/><text x="1000" y="660" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#14202E" text-anchor="start">조치 후 다시 ①로</text><text x="1000" y="704" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">같은 구간을 다시 찍어 등록하면</text><text x="1000" y="736" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">조치 전후를 같