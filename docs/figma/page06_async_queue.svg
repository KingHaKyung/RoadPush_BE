<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>6쪽 · 분석 대기열</title><g id="제목"><text x="128" y="154" font-family="'JetBrains Mono','D2Coding','Consolas',monospace" font-size="24" font-weight="600" fill="#2457D6" text-anchor="start">05 · ASYNC QUEUE</text><text x="128" y="222" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="56" font-weight="700" fill="#14202E" text-anchor="start">분석은 대기열에서 따로 처리한다</text></g><g id="상태 흐름"><rect x="128" y="528" width="190" height="100" rx="50" fill="#FCFCFA" stroke="#CBD2DA" stroke-width="2"/><text x="223.0" y="586" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" fill="#14202E" text-anchor="middle">등록 · 재분석</text><rect x="388" y="528" width="190" height="100" rx="16" fill="#E6E9ED" stroke="#9AA5B1" stroke-width="2"/><text x="483.0" y="572" font-family="'JetBrains Mono','D2Coding','Consolas',monospace" font-size="22" font-weight="600" fill="#14202E" text-anchor="middle">pending</text><text x="483.0" y="606" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="middle">대기</text><rect x="648" y="528" width="220" height="100" rx="16" fill="#14202E" stroke="#14202E" stroke-width="2"/><text x="758.0" y="572" font-family="'JetBrains Mono','D2Coding','Consolas',monospace" font-size="22" font-weight="600" fill="#F5F6F2" text-anchor="middle">processing</text><text x="758.0" y="606" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#C9D3DF" text-anchor="middle">분석 중</text><rect x="948" y="338" width="180" height="100" rx="16" fill="#E3EAFB" stroke="#2457D6" stroke-width="2"/><text x="1038.0" y="382" font-family="'JetBrains Mono','D2Coding','Consolas',monospace" font-size="22" font-weight="600" fill="#2457D6" text-anchor="middle">completed</text><text x="1038.0" y="416" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="middle">판정 · 유보</text><rect x="948" y="718" width="180" height="100" rx="16" fill="#FBE8DA" stroke="#B4500F" stroke-width="2"/><text x="1038.0" y="762" font-family="'JetBrains Mono','D2Coding','Consolas',monospace" font-size="22" font-weight="600" fill="#B4500F" text-anchor="middle">failed</text><text x="1038.0" y="796" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="middle">처리 실패</text><path d="M318.0,578.0 L378.4,578.0" fill="none" stroke="#4B5767" stroke-width="3" stroke-linejoin="round"/><polygon points="388.0,578.0 376.0,584.6 376.0,571.4" fill="#4B5767"/><path d="M578.0,578.0 L638.4,578.0" fill="none" stroke="#4B5767" stroke-width="3" stroke-linejoin="round"/><polygon points="648.0,578.0 636.0,584.6 636.0,571.4" fill="#4B5767"/><text x="618" y="504" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="500" fill="#4B5767" text-anchor="middle">워커가 꺼냄</text><path d="M868.0,558.0 L943.9,396.7" fill="none" stroke="#2457D6" stroke-width="3" stroke-linejoin="round"/><polygon points="948.0,388.0 948.9,401.7 936.9,396.0" fill="#2457D6"/><path d="M868.0,598.0 L943.9,759.3" fill="none" stroke="#B4500F" stroke-width="3" stroke-linejoin="round"/><polygon points="948.0,768.0 936.9,760.0 948.9,754.3" fill="#B4500F"/><text x="788" y="724" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="500" fill="#B4500F" text-anchor="start">입력 오류</text><path d="M758.0,628.0 L758.0,698.0 L483.0,698.0 L483.0,637.6" fill="none" stroke="#4B5767" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 6"/><polygon points="483.0,628.0 489.6,640.0 476.4,640.0" fill="#4B5767"/><text x="428" y="740" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="500" fill="#4B5767" text-anchor="start">실행 오류 → 자동 재시도</text><text x="428" y="772" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">(첫 시도 포함 최대 3회)</text></g><g id="202 즉시 응답"><rect x="1192" y="278" width="600" height="168" rx="16" fill="#FCFCFA" stroke="#CBD2DA" stroke-width="2"/><text x="1220" y="328" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#14202E" text-anchor="start">202 즉시 응답</text><text x="1220" y="372" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">등록은 원본 저장까지만 하고 바로 답합니다.</text><text x="1220" y="404" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">화면은 “분석 대기 중”을 보여 줍니다.</text></g><g id="워커 1개, 모델은 한 번만 로드"><rect x="1192" y="470" width="600" height="168" rx="16" fill="#FCFCFA" stroke="#CBD2DA" stroke-width="2"/><text x="1220" y="520" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#14202E" text-anchor="start">워커 1개, 모델은 한 번만 로드</text><text x="1220" y="564" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">GPU · CPU 하나에서 모델을 재사용하며</text><text x="1220" y="596" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">순서대로 처리합니다.</text></g><g id="판단 유보는 실패가 아니다"><rect x="1192" y="662" width="600" height="168" rx="16" fill="#FCFCFA" stroke="#CBD2DA" stroke-width="2"/><text x="1220" y="712" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" fill="#14202E" text-anchor="start">판단 유보는 실패가 아니다</text><text x="1220" y="756" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">AI가 확정하지 못한 건은 completed로 끝나고</text><text x="1220" y="788" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="400" fill="#4B5767" text-anchor="start">사람 검수로 넘어갑니다.</text></g></svg>