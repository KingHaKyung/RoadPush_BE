[project]
name = "roadpush-backend"
version = "0.1.0"
description = "RoadPush 백엔드: 관측 등록 · 보행공간 분석 · 검수 · 현장조치 · 재관측"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
# 실제 모델 추론용. torch는 CUDA 버전에 맞춰 따로 설치한다 (README 참고)
ml = [
    "torch>=2.3",
    "transformers>=4.44",
    "ultralytics>=8.3",
]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# FastAPI의 Depends/File/Form 기본값 패턴
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]
