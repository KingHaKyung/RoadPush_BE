[project]
name = "roadpush-backend"
version = "0.1.0"
description = "RoadPush 백엔드: 관측 등록 · 보행공간 분석 · 검수 · 현장조치 · 재관측"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
# ANALYSIS_ENGINE=roadpush_ai: RoadPush_AI 팀 파이프라인 (Python 3.12). 버전은 AI 저장소 requirements와 같게 고정한다
#   1) torch·torchvision을 먼저 CPU 또는 CUDA 12.8 인덱스에서 설치 (docs/SETUP.md 8장)
#   2) pip install -e ".[ai]"
#   3) pip install -e ../RoadPush_AI/surface_passability --no-deps   (또는 ROADPUSH_AI_ROOT로 src를 찾게 둔다)
ai = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "transformers==4.57.6",       # Mask2Former (AI requirements/inference-common.txt)
    "scipy==1.18.1",
    "ultralytics==8.4.176",       # Phase 6 YOLO11n-seg + 모델 팀 장애물 YOLO11s (obstacle_yolo는 8.4.183으로 학습)
    "PyYAML==6.0.3",              # obstacle_yolo/service/config.yaml
    "psutil==7.2.2",
    "requests==2.34.2",
    "matplotlib==3.11.2",         # roadpush_ai Phase 6 모듈이 import한다 (그림은 그리지 않음)
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# FastAPI의 Depends/File/Form 기본값 패턴
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]
