# 선택: SQLite 대신 PostgreSQL(+PostGIS)을 쓸 때
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: roadpush
      POSTGRES_PASSWORD: roadpush
      POSTGRES_DB: roadpush
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
